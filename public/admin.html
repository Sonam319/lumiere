<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin | LUMIERE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body data-page="admin">
    <header id="Header">
        <div class="bar">
            <a class="logo" href="./index.html">LUMIERE</a>
            <nav aria-label="Main"><a href="./index.html">Back to shop</a></nav>
        </div>
    </header>

    <section id="login-view" class="login-wrap">
        <form id="login-form" class="panel fields login-card" novalidate>
            <p class="eyebrow">Admin</p>
            <h1>Sign in</h1>
            <p>Manage your orders and customer messages.</p>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="btn" type="submit">Sign in</button>
            <p id="login-status" class="form-status" role="status" aria-live="polite"></p>
            <a class="link-btn back" href="./index.html">Back to the shop</a>
        </form>
    </section>

    <main id="dashboard" class="section admin-wrap" hidden>
        <div class="admin-top">
            <div>
                <p class="eyebrow">Dashboard</p>
                <h1>Orders &amp; messages</h1>
            </div>
            <div class="admin-actions">
                <button id="refresh" class="btn btn-outline" type="button">Refresh</button>
                <button id="logout" class="btn" type="button">Sign out</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat"><strong id="stat-orders">0</strong><span>Total orders</span></div>
            <div class="stat"><strong id="stat-pending">0</strong><span>Waiting for action</span></div>
            <div class="stat"><strong id="stat-sales">$0</strong><span>Sales (not cancelled)</span></div>
        </div>

        <p id="admin-status" class="form-status" role="status" aria-live="polite"></p>

        <h2 class="admin-heading">Orders</h2>
        <div id="orders"></div>

        <h2 class="admin-heading">Messages</h2>
        <div id="messages"></div>
    </main>

    <script src="./admin.js" defer></script>
</body>
</html>
