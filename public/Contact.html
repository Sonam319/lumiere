<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | LUMIERE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body data-page="contact">
    <div id="site-header"></div>

    <main>
        <section class="page-banner">
            <p class="eyebrow">Get in touch</p>
            <h1>Contact us</h1>
            <p>Send us a message and we will reply within one working day.</p>
        </section>

        <section class="section">
            <div class="contact-layout">
                <div>
                    <h2>We're here to help</h2>
                    <ul class="contact-details">
                        <li><strong>Email</strong><p>sphuntsho@gmail.com</p></li>
                        <li><strong>Phone</strong><p>+975 77693373</p></li>
                        <li><strong>Address</strong><p>Changangkha, Thimphu</p></li>
                        <li><strong>Hours</strong><p>Monday to Saturday, 9am to 6pm</p></li>
                    </ul>
                </div>

                <form id="contact-form" class="panel fields" novalidate>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Full name</label>
                            <input type="text" id="name" name="name" autocomplete="name">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" autocomplete="email">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="topic">Topic</label>
                        <select id="topic" name="topic">
                            <option>Order question</option>
                            <option>Product question</option>
                            <option>Returns and exchanges</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6"></textarea>
                    </div>
                    <button type="submit" class="btn">Send message</button>
                    <p id="contact-status" class="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="./script.js" defer></script>
</body>
</html>
