<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Arrivals | LUMIERE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body data-page="new">
    <div id="site-header"></div>

    <main>
        <section class="page-banner">
            <p class="eyebrow">Just landed</p>
            <h1>New arrivals</h1>
            <p>The newest additions to the LUMIERE collection.</p>
        </section>

        <section class="section">
            <div class="feature">
                <img src="./Images/bag4.jpg" alt="Three mini handbags in cream, monogram brown and blush pink" width="1024" height="536">
                <div class="feature-card">
                    <p class="eyebrow">The new edit</p>
                    <h2>Fresh shapes, just in</h2>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="product-grid">
                <article class="product-card" data-id="lagune-top-handle">
                    <div class="product-img"><span class="badge">New</span><img src="./Images/bag6.avif" alt="Teal leather bag with a gold ring handle" loading="lazy"><button class="add-btn" type="button">Add to cart</button></div>
                    <div class="product-info"><p class="product-cat">Handbags</p><h3>Lagune Top-Handle</h3><span class="price">Nu.1500</span></div>
                </article>
                <article class="product-card" data-id="capri-crossbody">
                    <div class="product-img pos-right"><span class="badge">New</span><img src="./Images/bag8.avif" alt="Nylon crossbody bag shown in five colours" loading="lazy"><button class="add-btn" type="button">Add to cart</button></div>
                    <div class="product-info"><p class="product-cat">Crossbody</p><h3>Capri Crossbody</h3><span class="price">Nu.3000</span></div>
                </article>
                <article class="product-card" data-id="weekender-duffel">
                    <div class="product-img crop-bars"><span class="badge">New</span><img src="./Images/bag3.jpg" alt="Two patterned weekender duffel bags with shoulder straps" loading="lazy"><button class="add-btn" type="button">Add to cart</button></div>
                    <div class="product-info"><p class="product-cat">Travel</p><h3>Weekender Duffel</h3><span class="price">Nu.5250</span></div>
                </article>
                <article class="product-card" data-id="noir-hobo">
                    <div class="product-img"><span class="badge">New</span><img src="./Images/bag5.jpg" alt="Black leather hobo bag with a gold clasp" loading="lazy"><button class="add-btn" type="button">Add to cart</button></div>
                    <div class="product-info"><p class="product-cat">Shoulder bags</p><h3>Noir Hobo</h3><span class="price">Nu.1200</span></div>
                </article>
            </div>
            <div class="section-cta"><a class="btn btn-outline" href="./Shop.html">View all products</a></div>
        </section>
    </main>

    <div id="site-footer"></div>
    <script src="./script.js" defer></script>
</body>
</html>
